name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: github-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm and Node, and install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Prepare the released docs and apps
        run: pnpm run prepare:site
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build the website
        run: pnpm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
